name: Build and deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      - name: Install Japanese fonts for OGP rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - run: npm test
      - run: npm run test:ui
      - name: Build static app and type pages
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          VITE_GAS_ENDPOINT: ${{ vars.VITE_GAS_ENDPOINT }}
      - run: npm run verify:dist
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
